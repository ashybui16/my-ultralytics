# LEAF-YOLO backbone and neck with the YOLO26 end-to-end detection head, P2/4 - P5/32 outputs
# Reference: LEAF-YOLO, Intelligent Systems with Applications 25 (2025) 200484

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-leaf.yaml' will call yolo26-leaf.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [1.00, 0.50, 1024] # LEAF-YOLO-N reference: 1.2M parameters, 5.6 GFLOPs
  s: [1.00, 1.00, 1024] # LEAF-YOLO reference: 4.28M parameters, 20.9 GFLOPs

# LEAF-YOLO backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4
  - [-1, 1, GhostConv, [64, 3, 1]]
  - [-1, 1, LEAF, [64]] # 3-P2/4
  - [-1, 1, MGC, [128]]
  - [-1, 1, LEAF, [128]] # 5-P3/8
  - [-1, 1, MGC, [256]]
  - [-1, 1, LEAF, [256]] # 7-P4/16
  - [-1, 1, MGC, [512]]
  - [-1, 1, LEAF, [256, True, 1, 1.0]] # e=1.0, matching LEAF-YOLO layers 42-49
  - [-1, 1, SPPRFEM, [256, 5]] # 10-P5/32

# LEAF-YOLO neck with the YOLO26 head
head:
  - [-1, 1, CoordBlock, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [128, 1, 1]] # route backbone P4
  - [[-1, -2], 1, Concat, [1]]
  - [-1, 1, LEAFT, [128]] # 15-P4/16

  - [-1, 1, CoordBlock, [64, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [5, 1, Conv, [64, 1, 1]] # route backbone P3
  - [[-1, -2], 1, Concat, [1]]
  - [-1, 1, LEAFT, [64]] # 20-P3/8

  - [-1, 1, CoordBlock, [64, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [32, 1, 1]] # route backbone P2
  - [[-1, -2], 1, Concat, [1]]
  - [-1, 1, LEAFT, [64]]
  - [-1, 1, ELAN, [64]] # 26 (P2/4-xsmall)

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 20], 1, Concat, [1]] # cat head P3
  - [-1, 1, ELAN, [128]] # 29 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4
  - [-1, 1, ELAN, [256]] # 32 (P4/16-medium)

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 34 (P5/32-large), cat backbone SPPRFEM

  - [[26, 29, 32, 34], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)

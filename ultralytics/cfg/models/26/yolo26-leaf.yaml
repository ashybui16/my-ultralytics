# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2

  - [-1, 1, Conv, [64, 3, 2]] 
  - [-1, 1, GhostConv, [64, 3, 1]]
  - [-1, 1, LEAF, [64]] # 3-P2/4

  - [-1, 1, MGC, [128]] 
  - [-1, 1, LEAF, [128]] # 5-P3/8

  - [-1, 1, MGC, [256]]
  - [-1, 1, LEAF, [256]] # 7-P4/16

  - [-1, 1, MGC, [512]]
  - [-1, 1, LEAF, [256]]
  - [-1, 1, SPPF, [256, 5, 3, True]]
  - [-1, 1, C2PSA, [256]] # 11-P5/32

# head
head:
  - [-1, 1, CoordBlock, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [128, 1, 1]]
  - [[-1, -2], 1, Concat, [1]] 
  - [-1, 1, LEAFT, [128]] # 16-P4/16

  - [-1, 1, CoordBlock, [64]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [5, 1, Conv, [64, 1, 1]]
  - [[-1, -2], 1, Concat, [1]] 
  - [-1, 1, LEAFT, [64]] # 21-P3/8

  - [-1, 1, CoordBlock, [64]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [32, 1, 1]]
  - [[-1, -2], 1, Concat, [1]]
  - [-1, 1, LEAFT, [64]]
  - [-1, 2, ELAN, [64]] # 27-P2/4

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 21], 1, Concat, [1]] 
  - [-1, 2, ELAN, [128]] # 30-P3/8

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, ELAN, [256]] # 33-P4/16

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # 35-P5/32

  - [27, 1, PConv, [3]] # 36-P2/4
  - [30, 1, PConv, [3]] # 37-P3/8
  - [33, 1, PConv, [3]] # 38-P4/16
  - [35, 1, PConv, [3]] # 39-P5/32

  - [[36, 37, 38, 39], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)

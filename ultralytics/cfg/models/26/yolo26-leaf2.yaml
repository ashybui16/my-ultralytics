# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2

  - [-1, 1, Conv, [64, 3, 2]] 
  - [-1, 1, LEAF, [64]] # 2-P2/4

  - [-1, 1, GhostPConv, [128, 3, 2]] 
  - [-1, 1, LEAF, [128]] # 4-P3/8

  - [-1, 1, GhostPConv, [256, 3, 2]]
  - [-1, 1, LEAF, [256]] # 6-P4/16

  - [-1, 1, GhostPConv, [512, 3, 2]]
  - [-1, 1, LEAF, [256]]
  - [-1, 1, SPPF, [256, 5, 3, True]]
  - [-1, 2, C2PSA, [256]] # 10-P5/32

# head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, PLEAFT, [256]] # 13-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, PLEAFT, [128]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, PLEAFT, [64]] # 19 (P2/4-xsmall)

  - [-1, 1, GhostPConv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, PELAN, [128]] # 22 (P3/8-small)

  - [-1, 1, GhostPConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, PELAN, [256]] # 25 (P4/16-medium)

  - [-1, 1, GhostPConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, PELAN, [256]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)

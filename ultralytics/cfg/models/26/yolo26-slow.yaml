# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, SPDConv, [64, 3, 2, True]]
  - [-1, 1, NeXtC2f, [64]]
  - [-1, 1, CoordAtt, []] # 3 - P2/4
  - [-1, 1, SPDConv, [128, 3, 2, True]]
  - [-1, 2, NeXtC2f, [128]]
  - [-1, 1, CoordAtt, []] # 6 - P3/8
  - [-1, 1, SCDown, [256, 3, 2]]
  - [-1, 2, NeXtC2f, [256]]
  - [-1, 1, CoordAtt, []] # 9 - P4/16
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 1, NeXtC2f, [512]]
  - [-1, 1, SPPF, [512, 5, 3, True]]
  - [-1, 1, C2PSA, [512]] # 13 - P5/32

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, NeXtC2f, [256]]
  - [-1, 1, CoordAtt, []] # 17 - P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, NeXtC2f, [128]]
  - [-1, 1, CoordAtt, []] # 21 - P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, NeXtC2f, [64]]
  - [-1, 1, CoordAtt, []] # 25 - P2/4

  - [-1, 1, SPDConv, [128, 3, 2, True]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 1, NeXtC2f, [128]]
  - [-1, 1, CoordAtt, []] # 29 - P3/8

  - [-1, 1, SCDown, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 1, NeXtC2f, [256]]
  - [-1, 1, CoordAtt, []] # 33 - P4/16

  - [[25, 29, 33], 1, Detect, [nc]]
